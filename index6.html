<!--Table Attributes-->

<!--Table Attributes are used to define the properties of a table. Some common attributes include:-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table border="1"
    cellspacing="8"
    cellpadding="3">
        <tr>
            <th>Item</th>
            <th>Price</th>
            <th>Quantity</th>
        </tr>
        <tr>
            <td>Chai</td>
            <td colspan="2">3</td>
            
        </tr>
        <tr>
            <td>Samosa</td>
            <td>11</td>
            <td rowspan="2">5</td>
        </tr>
        <tr>
            <td>Brownie</td>
            <td>12</td>
        </tr>
    
</body>
</html>
